name: Deploy to GitHub Pages

on:
  # Trigger deployment on push to the main branch
  push:
    branches:
      - main

  # Allows manual deployment triggering from the Actions tab in GitHub
  workflow_dispatch:

# Grant GITHUB_TOKEN permissions required for GitHub Pages deployments
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping in-progress runs as Pages queues them
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project with Vite
        run: npm run build

      - name: Create 404 SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
